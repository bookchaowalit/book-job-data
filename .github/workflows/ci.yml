name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[lake]"
      - name: Run contract and policy tests
        env:
          FREE_ONLY: "true"
          ALLOW_EXTERNAL_NETWORK: "false"
          ALLOW_PAID_PROVIDER: "false"
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src
      - name: Check CLI help
        run: |
          python -m book_job_data.ingest --help
          book-job-data --help
